 ist eine valide Aktion.`,"iq.targets.title":`Ziele nach Wert`,"iq.targets.lead":`Schieße nicht auf das Nächste, sondern auf das Richtige.`,"iq.targets.body":`Springalds auf Belagerung, Armbrüste auf schwere Ziele, Reiter in die Fernkampflinie. Überkill kostet Salven und damit Kämpfe.`,"iq.targets.cue":`Shift-Fokus in kleinen Gruppen, dann neu bewerten.`,"iq.switch.title":`Wechsle, bevor du musst`,"iq.switch.lead":`Die beste Komposition ist die, die der Gegner zu spät sieht.`,"iq.switch.body":`Behalte deine vorhandene Armee als Anker, ergänze ihren Counter-Counter und verschiebe neue Produktion. Vollständige harte Wechsel verschwenden Zeit und Veteranen.`,"iq.switch.cue":`Eine zweite Einheit behebt meist mehr als ein Upgrade auf der falschen.`,"meth.badge":`Transparente Methodik`,"meth.close":`Schließen`,"meth.title":`Was dieser Score kann – und was nicht.`,"meth.desc":`WAR ROOM ist ein Lernmodell, kein frame-genauer Kampfsimulator. Es erklärt natürliche Vorteile und zwingt die wichtigsten Variablen sichtbar in die Entscheidung.`,"meth.entries":`militärische Einträge`,"meth.civs":`Zivilisationen`,"meth.pairings":`gerichtete Paarungen`,"meth.whatIn":`Was einfließt`,"meth.in1":`Klassen- und Bonus-Schaden aus den aktuellen Einheitendaten`,"meth.in2":`Trefferpunkte, Rüstung, Angriffstempo und Reichweite`,"meth.in3":`Kostenvergleich oder gleiche Einheitenzahl`,"meth.in4":`Gelände, Micro-Niveau und relativer Upgrade-Vorteil`,"meth.limits":`Wichtige Grenzen`,"meth.limitsBody":`Zivilisationsboni, aktivierte Fähigkeiten, Landmark-Effekte, Formationstiefe, echte Pfadfindung und Patch-Sonderfälle können das Resultat drehen. Deshalb zeigt die App zusätzlich eine Modell-Sicherheit und markiert enge Ergebnisse als Skill-Matchup.`,"meth.sources":`Quellen`,"meth.src1":`Offizielles Zivilisationsverzeichnis`,"meth.src2":`Offizielle Einführung in das Counter-Prinzip`,"meth.src3":`AoE4 World – aus Spieldateien extrahierte Einheitenwerte`,"meth.src4":`AoE4 World Explorer`,"meth.disclaim timeUp":`Time's up`,"iq.heroTitle":`The counter is only the beginning.`,"iq.heroIntro":`Good fights come from information, timing, space and clean execution. These six rules are the glue between unit knowledge and games won.`,"iq.flow.see":`See`,"iq.flow.seeText":`Which class and how much production?`,"iq.flow.rate":`Assess`,"iq.flow.rateText":`Cost, age, upgrades, terrain?`,"iq.flow.answer":`Answer`,"iq.flow.answerText":`Counter directly or buy time?`,"iq.flow.execute":`Execute`,"iq.flow.executeText":`Formation, target choice, retreat path?`,"iq.rulesKicker":`The six combat rules`,"iq.rulesTitle":`A quick check before every commit.`,"iq.rulesIntro":`Open each rule and mark it once you have consciously applied it in a real game.`,"iq.progress":({n:e,total:t})=>`${e}/${t} applied`,"iq.applied":`Applied in a game`,"iq.setGoal":`Set as training goal`,"iq.preflightTitle":`10-second preflight`,"iq.preflight1":`What counters my source of damage?`,"iq.preflight2":`Do all units arrive at the same time?`,"iq.preflight3":`Which target has to die in the first volley?`,"iq.preflight4":`Where is my retreat path?`,"iq.scout.title":`Scout the production`,"iq.scout.lead":`Counters start 60–90 seconds before the fight.`,"iq.scout.body":`Count barracks, archery ranges, stables and siege workshops. A second production building is often more honest information than five visible units.`,"iq.scout.cue":`Ask every 45 seconds: what can they mass right now?`,"iq.budget.title":`Compare resources`,"iq.budget.lead":`Ten versus ten is rarely a fair comparison.`,"iq.budget.body":`A spearman costs far less than a knight. Counters work through affordable mass, not necessarily through the 1-on-1 fight.`,"iq.budget.cue":`Compare 720 resources against 720 resources.`,"iq.contact.title":`Control the contact`,"iq.contact.lead":`A ranged unit without distance is just expensive infantry.`,"iq.contact.body":`Front line, body-block, focus fire and retreat decide how long your theoretical bonus is even allo
